<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <title>Tambah Fasilitas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Tambah Fasilitas</h1>
    <a href="/" class="button">Kembali</a>
  </header>
  <main>
    <section class="form-container">
      <h2>Form Tambah Fasilitas</h2>
      <form id="add-facility-form" class="facility-form">
        <div class="form-group">
          <label for="nama">Nama Fasilitas</label>
          <input type="text" id="nama" placeholder="Nama Fasilitas" required>
        </div>
        <div class="form-group">
          <label for="alamat">Alamat</label>
          <input type="text" id="alamat" placeholder="Alamat Fasilitas" required>
        </div>
        <div class="form-group">
          <label for="no_telepon">No. Telepon</label>
          <input type="text" id="no_telepon" placeholder="No. Telepon" required>
        </div>
        <div class="form-group">
          <label for="tipe">Tipe</label>
          <input type="text" id="tipe" placeholder="Tipe Fasilitas" required>
        </div>
        <div class="form-group">
          <label for="latitude">Latitude</label>
          <input type="number" step="any" id="latitude" placeholder="Latitude" required>
        </div>
        <div class="form-group">
          <label for="longitude">Longitude</label>
          <input type="number" step="any" id="longitude" placeholder="Longitude" required>
        </div>
        <div class="form-group">
          <label for="jam_operasional">Jam Operasional</label>
          <input type="text" id="jam_operasional" placeholder="Jam Operasional" required>
        </div>
        <div class="form-group">
          <label for="rating">Rating</label>
          <input type="number" step="any" id="rating" placeholder="Rating (1-5)" required>
        </div>
        <div class="form-group">
          <label for="foto">URL Foto</label>
          <input type="text" id="foto" placeholder="URL Foto" required>
        </div>
        <button type="submit" class="btn-submit">Simpan</button>
      </form>
    </section>
  </main>
  <footer>
    <p>&copy; 2025 Rekomendasi Fasilitas</p>
  </footer>
  <script src="add-facility.js"></script>
</body>
</html>
