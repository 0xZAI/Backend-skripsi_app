<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
  <title>Edit Fasilitas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Edit Fasilitas</h1>
    <a href="/" class="button">Kembali</a>
  </header>

  <main>
    <section id="form-section">
      <h2>Form Edit Fasilitas</h2>
      <form id="edit-facility-form">
        <input type="hidden" id="facility-id" />
        <input type="text" id="nama" placeholder="Nama Fasilitas" required />
        <input type="text" id="alamat" placeholder="Alamat Fasilitas" required />
        <input type="text" id="no_telepon" placeholder="No. Telepon" required />
        <input type="text" id="tipe" placeholder="Tipe Fasilitas" required />
        <input type="number" step="any" id="latitude" placeholder="Latitude" required />
        <input type="number" step="any" id="longitude" placeholder="Longitude" required />
        <input type="text" id="jam_operasional" placeholder="Jam Operasional" required />
        <input type="number" step="any" id="rating" placeholder="Rating (1-5)" required />
        <input type="text" id="foto" placeholder="URL Foto" required />
        <button type="submit">Simpan</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Rekomendasi Fasilitas</p>
  </footer>

  <script src="edit-facility.js"></script>
</body>
</html>
